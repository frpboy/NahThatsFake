<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nah That's Fake Premium information - purchases are no longer available; existing plans and credits stay active until their end date.">
    <meta name="theme-color" content="#111111">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Nah That's Fake - Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo"><span aria-hidden="true">🔍</span> Nah That's Fake</h1>
            <div class="subtitle">Premium</div>
        </header>

        <div class="card" style="text-align: center;">
            <p style="font-size: 40px; margin: 10px 0;" aria-hidden="true">⭐</p>
            <p><strong>Purchases are no longer available.</strong></p>
            <p>New premium plans and credit packs can't be bought anymore.</p>
            <p style="opacity: 0.8;">Existing Premium plans stay active until their current end date. Any remaining purchased credits are still available.</p>
        </div>
    </div>

    <script>
        // Apply Telegram theme (same behaviour as the main app)
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();

            const applyTheme = () => {
                document.body.classList.toggle('dark', tg.colorScheme === 'dark');
            };

            applyTheme();
            if (typeof tg.onEvent === 'function') {
                tg.onEvent('themeChanged', applyTheme);
            }
        }
    </script>
</body>
</html>
