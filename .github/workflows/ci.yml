name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Install bot dependencies
        run: npm --prefix bot ci

      - name: Install mini-app dependencies
        run: npm --prefix tma ci

      - name: Run repository checks
        run: npm test

      # The bot lint script currently references an undeclared ESLint executable.
      # Tracked in #408; do not rely on globally installed tooling.
